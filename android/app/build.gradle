plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace "com.deepshield.app"
    // tflite_flutter 0.12+ is compiled against SDK 36.
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.deepshield.app"
        // tflite_flutter, image_picker and share_plus all support this
        // comfortably; bump higher only if you add plugins that need it.
        minSdkVersion 24
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // Keep the bundled .tflite model uncompressed in the APK so the
    // TFLite interpreter can memory-map it directly at runtime instead
    // of Android having to decompress it first.
    aaptOptions {
        noCompress "tflite"
    }

    buildTypes {
        release {
            // Signed with the debug key so `flutter run --release` and
            // `flutter build apk --release` work immediately. Replace
            // with your own signing config before publishing.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {}

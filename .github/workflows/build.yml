name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Analyzer issues are also posted as annotations so they show up on
      # the run summary page without needing to open the raw logs.
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos | tee analyze.txt
          status=${PIPESTATUS[0]}
          awk -F ' • ' '/^ *(error|warning) • /{
            level=$1; gsub(/ /, "", level);
            n=split($3, loc, ":");
            printf "::%s file=%s,line=%s::%s (%s)\n", level, loc[1], loc[2], $2, $4
          }' analyze.txt
          exit $status

      - name: Test
        if: ${{ !cancelled() }}
        run: |
          set +e
          flutter test 2>&1 | tee test.txt
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            msg=$(grep -v '^\s*$' test.txt | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=flutter test failed::$msg"
          fi
          exit $status

      - name: Build debug APK
        if: ${{ !cancelled() }}
        run: |
          set +e
          flutter build apk --debug 2>&1 | tee build.txt
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            msg=$(grep -v '^\s*$' build.txt | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=flutter build failed::$msg"
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: deepshield-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
